name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format and branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF#refs/tags/}"
          COMMIT_SHA="$(git rev-parse "${GITHUB_REF}")"

          echo "Tag: ${TAG}"
          echo "Commit: ${COMMIT_SHA}"

          # check 1: Формат тега должен быть v0.0.0 (semantic versioning)
          if ! echo "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ ERROR: Tag '${TAG}' does not match required format 'vX.Y.Z'"
            echo "   Examples: v1.0.0, v0.2.1, v1.2.3"
            echo "::error::Invalid tag format. Expected vX.Y.Z (e.g., v1.0.0)"
            exit 1
          fi
          echo "✅ Tag format is valid (semantic versioning)"

          # check 2: Тег должен указывать на коммит из ветки main
          git fetch origin main

          if git merge-base --is-ancestor "${COMMIT_SHA}" origin/main; then
            echo "✅ Tag points to a commit in origin/main branch"
          else
            echo "❌ ERROR: Tag '${TAG}' does NOT point to a commit in origin/main"
            echo "   Tags can only be created from the main branch!"
            echo "Deleting invalid tag..."
            API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API_URL}")

            if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 300 ]; then
              echo "::error::Tag '${TAG}' was deleted (not from main branch). HTTP ${HTTP_STATUS}"
            else
              echo "::error::Failed to delete tag '${TAG}'. HTTP ${HTTP_STATUS}. Please remove manually."
            fi

            exit 1
          fi

          echo "All validation checks passed!"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              runner: ubuntu-latest,
              goos: linux,
              goarch: amd64,
              binary: jcompressor-linux-amd64,
            }
          - {
              runner: ubuntu-latest,
              goos: linux,
              goarch: arm64,
              binary: jcompressor-linux-arm64,
            }

          - {
              runner: macos-13,
              goos: darwin,
              goarch: amd64,
              binary: jcompressor-darwin-amd64,
            }
          - {
              runner: macos-latest,
              goos: darwin,
              goarch: arm64,
              binary: jcompressor-darwin-arm64,
            }

          - {
              runner: windows-latest,
              goos: windows,
              goarch: amd64,
              binary: jcompressor-windows-amd64.exe,
            }
          - {
              runner: ubuntu-latest,
              goos: windows,
              goarch: arm64,
              binary: jcompressor-windows-arm64.exe,
            }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install libwebp (Linux amd64)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebp-dev

      - name: Install cross-compiler and libwebp (Linux arm64)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          sudo dpkg --add-architecture arm64

          CODENAME=$(lsb_release -cs)

          # Ограничиваем существующие источники архитектурой amd64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi

          # Добавляем arm64-источники (ports.ubuntu.com)
          cat <<EOF | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${CODENAME} main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${CODENAME}-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${CODENAME}-security main restricted universe multiverse
          EOF

          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libwebp-dev:arm64

      - name: Install libwebp (macOS)
        if: runner.os == 'macOS'
        run: brew install webp

      - name: Setup MSYS2 (Windows amd64)
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libwebp
            mingw-w64-x86_64-pkg-config

      - name: Install llvm-mingw and build libwebp (Windows arm64)
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        run: |
          set -euo pipefail

          # llvm-mingw — кросс-компилятор для Windows arm64
          LLVM_MINGW_VERSION="20260224"
          LLVM_MINGW_NAME="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
          curl -sL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_NAME}.tar.xz" \
            | tar xJ -C /opt
          LLVM_MINGW_DIR="/opt/${LLVM_MINGW_NAME}"
          echo "${LLVM_MINGW_DIR}/bin" >> "$GITHUB_PATH"
          export PATH="${LLVM_MINGW_DIR}/bin:${PATH}"
          SYSROOT="${LLVM_MINGW_DIR}/aarch64-w64-mingw32"

          # Сборка libwebp из исходников для Windows arm64
          sudo apt-get update && sudo apt-get install -y cmake
          WEBP_VERSION="1.5.0"
          curl -sL "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-${WEBP_VERSION}.tar.gz" \
            | tar xz
          cd "libwebp-${WEBP_VERSION}"
          mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-w64-mingw32-gcc \
            -DCMAKE_INSTALL_PREFIX="${SYSROOT}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DWEBP_BUILD_CWEBP=OFF \
            -DWEBP_BUILD_DWEBP=OFF \
            -DWEBP_BUILD_GIF2WEBP=OFF \
            -DWEBP_BUILD_IMG2WEBP=OFF \
            -DWEBP_BUILD_VWEBP=OFF \
            -DWEBP_BUILD_WEBPINFO=OFF \
            -DWEBP_BUILD_WEBPMUX=OFF \
            -DWEBP_BUILD_EXTRAS=OFF \
            -DWEBP_BUILD_ANIM_UTILS=OFF
          cmake --build . --parallel
          cmake --install .

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'  && !(matrix.goos == 'windows')
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
            export CGO_CFLAGS="-I/usr/include"
            export CGO_LDFLAGS="-L/usr/lib/aarch64-linux-gnu -lwebp"
          fi

          go build -ldflags="-s -w" -o "${{ matrix.binary }}" ./cmd/jcompressor

      - name: Build (Windows amd64)
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        shell: msys2 {0}
        run: |
          export GOOS=windows
          export GOARCH=amd64
          export CGO_ENABLED=1
          go build -ldflags="-s -w" -o "${{ matrix.binary }}" ./cmd/jcompressor

      - name: Build (Windows arm64)
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: arm64
          CC: aarch64-w64-mingw32-gcc
        run: |
          LLVM_MINGW_VERSION="20250114"
          SYSROOT="/opt/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64/aarch64-w64-mingw32"
          export CGO_CFLAGS="-I${SYSROOT}/include"
          export CGO_LDFLAGS="-L${SYSROOT}/lib -lwebp"
          go build -ldflags="-s -w" -o "${{ matrix.binary }}" ./cmd/jcompressor

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
