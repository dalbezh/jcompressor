# push/PR → lint + test (всегда)
# PR в main → + build (проверка сборки на всех платформах

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  build:
    if: github.event_name == 'pull_request'
    needs: [lint, test]
    uses: ./.github/workflows/build.yml
